name: Guard Recommendation Limit

on:
  issues:
    types:
      - opened
      - labeled
      - reopened

permissions:
  issues: write

concurrency:
  group: recommendation-limit-${{ github.event.issue.user.login }}
  cancel-in-progress: false

jobs:
  guard:
    name: Enforce recommendation limit
    if: contains(github.event.issue.labels.*.name, 'recommend')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check account recommendation count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RECOMMENDATION_LIMIT: 3
        run: node ./scripts/enforce-recommendation-limit.mjs
